<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#E8820C" />
        <meta name="description" content="DestinoWay AI - plan and book hotels, flights, buses and cabs by chat or voice." />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="DestinoWay" />
        <meta property="og:title" content="DestinoWay AI" />
        <meta property="og:description" content="Plan and book hotels, flights, buses and cabs by chat or voice." />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
        <!--
        Notice the use of %PUBLIC_URL% in the tags above.
        It will be replaced with the URL of the `public` folder during the build.
        Only files inside the `public` folder can be referenced from the HTML.

        Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
        work correctly both with client-side routing and a non-root public URL.
        Learn how to configure a non-root public URL by running `npm run build`.
        -->
        <link rel="icon" type="image/png" href="%PUBLIC_URL%/logo-mark.png" />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo-mark.png" />
        <title>DestinoWay AI</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
